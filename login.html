<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Birthday Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-card">
        <h2>Birthday Assistant</h2>
        <p class="subtitle">Sign in to access personal birthday information</p>

        {% if error %}
        <div class="alert-error">
            {{ error }}
        </div>
        {% endif %}

        {% if message %}
        <div class="alert-success">
            {{ message }}
        </div>
        {% endif %}

        <form method="POST" action="/login" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn-primary auth-btn">Log In</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account yet? <a href="/register">Register here</a></p>
            <p class="hint-text">Default demo accounts: <code>admin</code> / <code>admin123</code> or <code>user</code> / <code>user123</code></p>
        </div>
    </div>
</body>
</html>
